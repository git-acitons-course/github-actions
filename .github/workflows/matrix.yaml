name: Matrix
on: [push]

jobs:
  node-matrix:
    continue-on-error: true
    strategy:
      matrix:
        node-version: [14, 15, 16]
      fail-fast: true
    runs-on: ubuntu-latest
    steps:
      - run: node --version
      - uses: actions/setup-node@v3
        with:
          node-version: ${{matrix.node-version}}
      - run: node --version
