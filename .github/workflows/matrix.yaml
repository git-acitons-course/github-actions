name: Matrix
on: [push]

jobs:
  node-matrix:
    continue-on-error: false
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node-version: [14, 15, 16]
      fail-fast: true
    runs-on: ${{ matrix.os }}
    steps:
      - run: node --version
      - uses: actions/setup-node@v3
        with:
          node-version: ${{matrix.node-version}}
      - run: node --version
